id: J-03
title: Primary bath with vague details
description: >
  Redo the primary bath at 7 Tuscan Rd. Rip out the tub, put in a walk-in tile shower. Double vanity
  instead of the single. Heated floor. Owner wants a bigger window over the tub area. Budget $32k.

property: { municipality: Maplewood, address: 7 Tuscan Rd, prop_class: "2", year_built: 1938, dwelling_type: detached_1f }
costs: { total: 32000 }

# The AI must not assume the drain moves. A bigger window is an enlarged opening, and the description
# doesn't mention a tile floor (owner decisions 2026-10-26, M3; test doc change 8).
work_items:
  - { id: shower, kind: fixture, label: Walk-in tile shower replaces the tub, fixtures: { shower: 1 } }
  - { id: lavs, kind: fixture, label: Double vanity replaces single (second lavatory added), fixtures: { lavatory: 2 }, action: add }
  - { id: heated_floor, kind: electrical, label: Radiant floor heat mat, action: add, devices: 0, equipment: radiant_floor_heat }
  - { id: window, kind: opening, label: Bigger window over the tub area, opening: window, action: enlarge }
  - { id: vanity, kind: finishes, label: Double vanity cabinet, element: vanity }
  - { id: shower_tile, kind: finishes, label: Tile shower walls, element: wall_tile }

expected_questions:
  - shower.action            # Q1 Is the shower drain staying where the tub drain is?
  - lavs.upsizing_needed     # Q2 Will the second sink need a bigger drain or water line?
  - heated_floor.new_circuit # Q3 Is the heated floor on a new circuit?
  - costs.plumbing           # Q5 Cost split by trade?
  - costs.electrical

answers:
  shower.action: relocate               # drain moves about 3 ft
  lavs.upsizing_needed: "no"            # ties into the existing drain
  heated_floor.new_circuit: other       # new 20A GFCI circuit; mat under 1 kW
  heated_floor.label: Radiant floor heat mat on new 20A GFCI circuit
  costs.plumbing: 6000
  costs.electrical: 2000

