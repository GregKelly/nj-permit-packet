id: J-01
title: Kitchen gut with wall removal
description: >
  Full kitchen gut at 34 Oakview Ave for the Morenos. Taking down the wall between the kitchen and
  dining room. It's not load bearing, I checked from the basement, joists run parallel to it. New
  cabinets, quartz counters, LVP floor, new drywall throughout. Moving the sink to the new island and
  adding a dishwasher and disposal there. Electrical: two new 20A counter circuits, 8 recessed cans,
  island outlets, about 18 devices total. Range stays where it is, same gas hookup. Contract is
  $48,000: plumbing about $3,500, electrical about $5,500.

