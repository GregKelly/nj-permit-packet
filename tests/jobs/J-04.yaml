id: J-04
title: Full basement finish with bathroom
description: >
  Finish the basement at 52 Durand Rd: family room, home office, full bath. Framing, drywall, drop
  ceiling. Bath gets a toilet, sink and shower. Toilet needs an ejector pit since the main drain is
  above the slab. About 14 recessed lights and 12 outlets on new 20A circuits, plus 2 hardwired
  smoke/CO combos tied into the existing ones upstairs. Extend 3 supply runs off the existing trunk.
  Spray foam the rim joists. Ceiling is 7'2" to the joists. $68k total: plumbing $9k, electrical $7k,
  HVAC $1.5k.

property: { municipality: Maplewood, address: 52 Durand Rd, prop_class: "2", year_built: 1956, dwelling_type: detached_1f }
costs: { total: 68000, plumbing: 9000, electrical: 7000, mechanical: 1500 }

work_items:
  - { id: framing, kind: partitions, label: "Framing, drywall, drop ceiling" }
  - { id: foam, kind: insulation, label: Spray foam the rim joists, type: foam }
  - { id: rooms, kind: habitable_space, label: "Family room, home office" }
  - { id: bath, kind: new_bathroom, label: "Basement bath: toilet, sink, shower, ejector pit", fixtures: { water_closet: 1, lavatory: 1, shower: 1 }, ejector_pump: "yes" }
  - { id: electrical, kind: electrical, label: "14 recessed lights and 12 outlets on new 20A circuits", action: add, devices: 26, new_circuit: other }
  - { id: alarms, kind: smoke_co_alarm, label: 2 hardwired smoke/CO combos tied into existing, power: hardwired, count: 2 }
  - { id: ducts, kind: ductwork, label: "Supply duct extension, 3 runs", action: extend }

expected_questions:
  - rooms.bedroom                # Will any finished room be used as a bedroom?
  - rooms.fuel_appliance_nearby  # Is the furnace or water heater in or next to the finished rooms?

answers:
  rooms.bedroom: "no"
  rooms.fuel_appliance_nearby: "no"   # separate unfinished utility room

