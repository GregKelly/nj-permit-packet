id: J-10
title: "\"Cosmetic\" kitchen with a pro range"
description: >
  Kitchen refresh at 27 Prospect St. Paint the existing cabinets, new quartz counters and backsplash.
  Swapping the 30" range for a 36" pro gas range in the same spot, which needs a bigger gas line from
  the meter. Replacing the old recirculating hood with a 900 cfm hood ducted outside through the back
  wall. Total $21,000: gas line $1,200, electrical $600, hood and ductwork $1,800.

