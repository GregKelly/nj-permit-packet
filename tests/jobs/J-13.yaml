id: J-13
title: Twin, owner swaps the furnace and A/C
description: >
  Taking out the non-bearing wall between kitchen and dining room at 41 Burnet Ave (left half of a
  twin) and redoing the drywall in both rooms, $16k. The owners live there. While we're at it they
  want to swap the old gas furnace and the AC condenser themselves, same size (80k BTU, 3-ton),
  condenser back on the same pad, and do the wiring for them too. They figure $6,500 for the
  equipment and $200 for the wiring.

property: { municipality: Maplewood, address: 41 Burnet Ave, prop_class: "2", year_built: 1931, dwelling_type: attached, owner_occupied: "yes" }
costs: { building: 16000, electrical: 200, mechanical: 6500 }
performed_by: { electrical: owner, mechanical: owner }

work_items:
  - { id: wall, kind: wall_change, label: Remove non-bearing wall between kitchen and dining room, action: remove, bearing: "no" }
  - { id: drywall, kind: drywall, label: Redo drywall in kitchen and dining room, extent: 25_percent_or_more }
  - { id: furnace, kind: hvac_equipment, label: "Gas furnace, 80k BTU, same size", equipment: furnace, action: replace, like_capacity: "yes", fuel_change: "no", fuel: gas }
  - { id: condenser, kind: hvac_equipment, label: "A/C condensing unit, 3-ton", equipment: ac_condenser, action: replace, like_capacity: "yes", same_location: "yes", fuel: none, fuel_change: "no" }

expected_questions: []
answers: {}

