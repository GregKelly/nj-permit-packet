# Expected boxes for each party, written out once. A job's expected entries
# say `contractor: <key>` to include one of these blocks. Values are literal:
# they come from tests/jobs/_profile.yaml as a person would copy them onto the form.

# F100 §I Principal Contractor and page 2 Agent Section (the contractor applies as agent).
f100_hollis:
  contractor.name: Hollis Building Co. LLC
  contractor.phone: 973-555-0101
  contractor.address: 1800 Springfield Ave
  contractor.address_2: Maplewood, NJ 07040
  contractor.email: office@hollis.example
  contractor.hic: 13VH00000001
  contractor.fein: "000000001"          # the F100 box takes 9 digits, no dash
  agent.is_contractor: true
  agent.name: Hollis Building Co. LLC
  agent.address: 1800 Springfield Ave
  agent.city_state_zip: Maplewood, NJ 07040
  agent.phone: 973-555-0101

# F100 §I Principal Contractor only: when the owner is the applicant (HO-F1), the Agent Section stays blank.
f100_hollis_principal:
  contractor.name: Hollis Building Co. LLC
  contractor.phone: 973-555-0101
  contractor.address: 1800 Springfield Ave
  contractor.address_2: Maplewood, NJ 07040
  contractor.email: office@hollis.example
  contractor.hic: 13VH00000001
  contractor.fein: "000000001"

